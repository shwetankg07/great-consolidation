name: daily

on:
  schedule:
    # 05:40 UTC. Scheduled runs on shared runners drift under load, and a time
    # that is not on the hour tends to be picked up sooner.
    - cron: "40 5 * * *"
    # A second attempt twelve hours later. The job is idempotent: it upserts
    # the day's rows and exits without committing when nothing changed, so a
    # successful morning run makes this one a no-op. It exists so that a
    # single upstream outage or runner failure costs nothing.
    - cron: "40 17 * * *"
  workflow_dispatch:

# One run at a time. Two collectors writing the same CSVs would race on the
# commit, and a manual dispatch during a scheduled run is the usual way that
# happens.
concurrency:
  group: daily-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Collect today's snapshot
        run: python collect.py

      - name: Redraw charts and README
        run: python render.py

      - name: Commit
        env:
          COMMIT_EMAIL: ${{ secrets.COMMIT_EMAIL }}
        run: |
          set -euo pipefail

          # The contribution graph only counts commits whose author email is
          # verified on the account. A commit authored by github-actions[bot]
          # is attributed to the bot and appears on nobody's graph. Checked up
          # front, because the failure is otherwise silent: the commits land,
          # the repository looks healthy, and the graph stays empty.
          if [ -z "${COMMIT_EMAIL:-}" ]; then
            echo "COMMIT_EMAIL secret is not set." >&2
            echo "Set it to an email verified on the account, or these" >&2
            echo "commits will not appear on the contribution graph:" >&2
            echo "  gh secret set COMMIT_EMAIL --body 'you@example.com'" >&2
            exit 1
          fi

          git config user.name "Shwetank Gupta"
          git config user.email "$COMMIT_EMAIL"

          # Everything this job writes is derived from upstream data, so the
          # answer to a diverged remote is to regenerate on top of it rather
          # than to reconcile two versions of a generated file. Rebasing here
          # conflicts on data/daily.csv and README.md and loses the day's work.
          stage_and_commit() {
            git add data charts README.md

            # Staging first, then checking the index, so a brand new chart
            # file counts as a change. `git diff` alone ignores untracked paths.
            if git diff --cached --quiet; then
              echo "Nothing changed upstream today."
              return 1
            fi

            git commit -m "$(cat .commit-subject)"
            return 0
          }

          stage_and_commit || exit 0

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected, remote moved. Regenerating on top of it."
            git fetch origin main
            git reset --hard origin/main
            python collect.py
            python render.py
            stage_and_commit || exit 0
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
